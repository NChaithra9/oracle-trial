# ============================================
# The Oracle's Trial - backend configuration
# ============================================

server.port=8080

# --- OpenAI ---
# The actual key value comes from the .env file (OPENAI_API_KEY),
# loaded at startup by OracleTrialApplication using dotenv-java.
# Defaulting to "" (instead of leaving this required) means a missing key
# produces a clear error from EmbeddingService/AnswerService at startup
# instead of a generic Spring "could not resolve placeholder" failure.
openai.api.key=${OPENAI_API_KEY:}
openai.embedding.model=text-embedding-3-small
openai.chat.model=gpt-4o-mini

# --- Qdrant (REST API) ---
qdrant.url=http://localhost:6333
qdrant.collection=documents
# Vector size must match the embedding model above.
# text-embedding-3-small produces 1536-dimensional vectors.
qdrant.vector.size=1536

# --- RAG tuning ---
# Chunk size / overlap are in approximate characters.
app.chunk.size=1000
app.chunk.overlap=200
# Number of most similar chunks retrieved per question.
app.top-k=5

# --- File upload limits ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Logging ---
logging.level.com.oracle.trial=INFO
